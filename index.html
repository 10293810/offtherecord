<!doctype html>
<html lang="ko" class="fonts-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<style>html,body{-webkit-text-size-adjust:none!important;text-size-adjust:none!important}</style>
<title>Setlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+JP:wght@800&family=Inter:wght@500;600;700;800;900&family=Noto+Serif+Display:wght@700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;900&family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Condensed:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=202611200250">
</head>
<body>

<!-- ============ 첫 화면 (INTRO · 열쇠가 차오르는 입장 화면) ============ -->
<section id="intro" class="en2">
  <div class="en-bg"><i class="en-grid"></i><i class="en-b1"></i><i class="en-b2"></i></div>
  <header class="en-head"><span class="en-logo"><i data-icon="moon"></i><b></b><small></small></span>
    <span class="en-hr"><span class="en-room"><i class="en-dot"></i><b></b> <em></em></span><span class="en-clock"></span></span></header>
  <div class="en-stage">
    <div class="en-halo"></div>
    <div class="en-spark"></div>
    <div class="en-glow"></div>
    <div class="en-deco"></div>
    <div class="en-lockbox"><div class="en-lockfloat">
      <div class="en-wing"></div>
      <div class="en-leaves"></div>
      <div class="en-burst"></div>
      <div class="en-med"></div>
    </div></div>
    <div class="en-fx"><div class="en-ring"></div><div class="en-bits"></div></div>
    <button class="en-hit" aria-label="자물쇠를 눌러 입장" disabled></button>
    <div class="en-load"><div class="en-lt"><span class="en-ltxt"></span><span class="en-pct">0%</span></div>
      <div class="en-bar"><i></i></div><div class="en-ms"></div></div>
  </div>
</section>

<!-- ============ 바탕화면 (DESK) ============ -->
<div id="desk">
  <header class="topbar">
    <button class="logo logo-dark" data-nav="home"><span class="logo-ic" data-icon="moon"></span><div><b data-bind="brand.home"></b><small data-bind="brand.homeSub"></small></div></button>
    <nav class="topnav">
      <button data-nav="home">HOME</button>
      <button data-open="records"><i data-icon="folder"></i>CATEGORY</button>
      <button data-open="notice"><i data-icon="bell"></i>NOTICE</button>
      <button class="sy-only" data-open="dday"><i data-icon="heart"></i><span class="sy-navt">LUVINFO</span></button>
    </nav>
    <div class="top-r">
      <span class="pill white"><i class="led"></i><span data-bind="online"></span></span>
      <span class="clock"></span>
      <button class="sq theme-btn" title="다크 모드"><i data-icon="moon"></i></button>
      <button class="sq" data-nav="launcher" title="창 정렬"><i data-icon="grid"></i></button>
      <button class="sq sy-only sy-write" type="button" title="글쓰기"><i data-icon="pen"></i></button>
    </div>
  </header>

  <main class="stage">
    <div class="leftcol">
    <div class="hz ltop">
    <!-- 메인 제목 : 셋리스트 메모장 -->
    <section class="h-otr">
      <div class="ho-kick"><span class="hk-a"></span><i></i><span class="hk-b"></span></div>
      <div class="ho-title"></div>
      <div class="ho-np" data-open="player"></div>
    </section>
    <section class="h-note" hidden>
      <section class="h-garland gone" hidden></section>
      <i class="hn-tape"></i>
      <div class="hn-paper">
        <div class="hn-holes"></div>
        <div class="hn-kick"></div>
        <svg class="h-svg" viewBox="0 0 380 92"></svg>
        <ul class="hn-list"></ul>
      </div>
      <div class="hn-sticky"><small></small><b></b><span></span></div>
      <div class="hn-dust"></div>
    </section>
    </div>
    <!-- 앱 -->
    <section class="apps-panel">
      <div class="panel-tab"><i data-icon="folder"></i><span>APPLICATIONS</span></div>
      <div class="apps"></div>
    </section>
    </div>
    <!-- 가운데 : 도는 열쇠 -->
    <section class="keysec">
      <div class="ks-head"><b class="ks-t"></b><span class="ks-s"></span></div>
      <div class="ks-dust"></div>
      <div class="ks-shadow"></div>
      <div class="ks-3d"><div class="k-rings"></div><div class="k-float"><div class="k-spin home-spin"></div></div></div>
      <div class="ks-mq"><div class="mq-track"></div></div>
    </section>
    <!-- (예전 도면 · SPEC SHEET 자리 — 지금은 안 보여요) -->
    <div class="blueprint" hidden></div>
    <section class="spec" hidden></section>
  </main>

  <div id="winlayer"></div>
  <div id="toasts"></div>

  <footer class="taskbar">
    <button class="start" data-nav="launcher"><i data-icon="moon"></i><span data-bind="brand.start"></span></button>
    <div class="tasks"></div>
    <div class="tb-r">
      <div class="mini">
        <span class="mini-cover ph v3"></span>
        <div class="mini-t"><small>BGM</small><b class="mini-title"></b></div>
        <span class="mini-eq"><i></i><i></i><i></i></span>
        <button class="mini-play"><i data-icon="play"></i></button>
      </div>
      <button class="sq" data-open="links" title="Link Hub"><i data-icon="link"></i></button>
      <button class="sq to-top" title="맨 위로"><i data-icon="chevup"></i></button>
      <div class="credit"><small data-bind="credit.top"></small><b data-bind="credit.bottom"></b></div>
    </div>
  </footer>

  <div id="launcher" class="launcher"></div>
</div>

<audio id="audio" preload="none"></audio>
<script src="data.js?v=202611210220"></script>
<script src="script.js?v=202611210300"></script>
</body>
</html>
